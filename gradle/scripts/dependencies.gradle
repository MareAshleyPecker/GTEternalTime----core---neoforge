// 依赖声明与 GTCEu 嵌套库抽取任务
dependencies {
    // ── Kotlin for Forge（Kotlin mod 运行期必需；模板自带 5.3.0，这里对齐 GTM 用的 5.7.0）──
    implementation "thedarkcolour:kotlinforforge-neoforge:${kotlinforforge_version}"

    // ── 阶段 1：GTCEu 8.0.0（1.21.1）—— 用 libs/ 里的本地 jar（SNAPSHOT，maven 上不一定有）──
    compileOnly files("libs/gtceu-1.21.1-8.0.0-SNAPSHOT.jar")
    runtimeOnly files("libs/gtceu-1.21.1-8.0.0-SNAPSHOT.jar")

    // ── 阶段 2：GTCEu 8.0.0 自带的三个嵌套库（jarJar）──
    // 上面那个 gtceu 是文件依赖，不带传递依赖元数据，所以它 jarJar 里的库必须在编译期显式给出来：
    //   com.tterrag.registrate:Registrate:MC1.21-1.3.0+67      → GTRegistrate 的父类，注册机器必需
    //   brachy.modularui:modularui-mc1.21.1:3.3.1-SNAPSHOT    → GTM 8.0.0 的 UI 库（替代 LDLib2）
    //   dev.toma.configuration:configuration-1.21.1:3.1.1-neoforge → GTM 8.0.0 的配置库
    // 运行期由 gtceu 的 jarJar 提供（dev 环境 NeoForge 也会展开），所以这里只用 compileOnly，不重复放一份。
    // libs/jarjar/ 里的 jar 是用本文件末尾的 extractGtceuJarJar 任务从 gtceu jar 里抽出来的。
    compileOnly files("libs/jarjar/Registrate-MC1.21-1.3.0+67.jar")
    compileOnly files("libs/jarjar/modularui-mc1.21.1-3.3.1-SNAPSHOT.jar")
    compileOnly files("libs/jarjar/configuration-1.21.1-3.1.1-neoforge.jar")

    // LDLib2：GTCEu 8.0.0 已弃用它（不再捎带），要用就得自己声明；`:all` 才是带全依赖的 jar。
    implementation "com.lowdragmc.ldlib2:ldlib2-neoforge-${minecraft_version}:${ldlib2_version}:all"

    // ── 阶段 3（可选）：AE2 集成 ──
    // 坐标用 Modrinth Maven（仓库已在 repositories.gradle 里，jade 同款）：`maven.modrinth:ae2:<version_number>`。
    // appeng:* 那套坐标（appliedenergistics2-neoforge / -forge）在本机两个仓库都解析不到，别用。
    // jar 里带 314 个 appeng.api.* 类，可直接当编译依赖用。
    compileOnly "maven.modrinth:ae2:${ae2_version}"
    runtimeOnly "maven.modrinth:ae2:${ae2_version}"

    // GuideME 是 AE2 的**必需**前置（AE2 自己的 mods.toml 写 `guideme [21.1.1,)`），
    // 不放进运行期 AE2 根本加载不起来；我们代码不直接引用它，给 compileOnly 只是为了万一。
    compileOnly "maven.modrinth:guideme:${guideme_version}"
    runtimeOnly "maven.modrinth:guideme:${guideme_version}"

    // ── Jade（可选依赖，坐标与版本对齐 GTM 的 gradle/forge.versions.toml:97）──
    // runtimeOnly 是给 dev 客户端用的：不放进运行期就进不了游戏验证。
    compileOnly "maven.modrinth:jade:${jade_version}"
    runtimeOnly "maven.modrinth:jade:${jade_version}"

    // ── 配方查看器：JEI（1.21.1 的坐标是 neoforge，不是 forge）──
    compileOnly "mezz.jei:jei-1.21.1-common-api:${jei_version}"
    compileOnly "mezz.jei:jei-1.21.1-neoforge-api:${jei_version}"
    runtimeOnly "mezz.jei:jei-1.21.1-neoforge:${jei_version}"

    // ── 配方查看器：EMI（`:api` 是编译期接口，运行期要本体）──
    compileOnly "dev.emi:emi-neoforge:${emi_version}:api"
    runtimeOnly "dev.emi:emi-neoforge:${emi_version}"

    // Example mod dependency using a mod jar from ./libs with a flat dir repository
    // This maps to ./libs/coolmod-${mc_version}-${coolmod_version}.jar
    // The group id is ignored when searching -- in this case, it is "blank"
    // implementation "blank:coolmod-${mc_version}:${coolmod_version}"

    // Example mod dependency using a file as dependency
    // implementation files("libs/coolmod-${mc_version}-${coolmod_version}.jar")

    // Example project dependency using a sister or child project:
    // implementation project(":myproject")

    // For more info:
    // http://www.gradle.org/docs/current/userguide/artifact_dependencies_tutorial.html
    // http://www.gradle.org/docs/current/userguide/dependency_management.html
}

// 把 gtceu 的局部 jar 里 jarJar 的嵌套库抽到 libs/jarjar/，供上面那几个 compileOnly 使用。
// 换 gtceu 版本时重跑一次即可：gradlew extractGtceuJarJar --rerun-tasks
tasks.register("extractGtceuJarJar", Copy) {
    description = "从 libs/ 的 gtceu jar 里抽出它 jarJar 的嵌套库（Registrate / MUI / configuration）"
    group = "gtet"
    from({ zipTree(file("libs/gtceu-${minecraft_version}-${gtceu_version}.jar")) {
        include "META-INF/jarjar/*.jar"
    } })
    into("libs/jarjar")
    eachFile { it.relativePath = new RelativePath(true, it.name) }
    includeEmptyDirs = false
}
